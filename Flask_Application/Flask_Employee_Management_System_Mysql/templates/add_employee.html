{% extends 'base.html' %}

{% block title %}
Add Employee
{% endblock %}

{% block content %}

<div class="container fade-in">
    <section class="page-header">
        <div>
            <p class="eyebrow">Employee management</p>
            <h1>Add new employee</h1>
            <p class="dashboard-copy">Create a profile with salary and contact details so your team stays up to date.</p>
        </div>
    </section>

    <div class="form-card">
        <h2>Employee details</h2>
        <form method="POST">
            <div class="form-grid">
                <div>
                    <label class="field-label" for="employee_id">Employee ID</label>
                    <input id="employee_id" type="text" name="employee_id" value="{{ suggested_id }}" readonly required>
                    <p class="field-hint">Auto-generated. Each employee ID must be unique.</p>
                </div>
                <div>
                    <label class="field-label" for="name">Employee Name</label>
                    <input id="name" type="text" name="name" placeholder="Employee Name" required>
                </div>
                <div>
                    <label class="field-label" for="salary">Annual Salary (INR)</label>
                    <input id="salary" type="text" name="salary" placeholder="e.g. 1200000" required>
                </div>
                <div>
                    <label class="field-label" for="email">Email</label>
                    <input id="email" type="email" name="email" placeholder="Email" required>
                </div>
            </div>
            <button class="btn btn-primary" type="submit">Add Employee</button>
        </form>
    </div>
</div>

{% endblock %}
